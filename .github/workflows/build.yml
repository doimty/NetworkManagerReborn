name: Build iOS Tweak with Theos

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1

      - name: Install CCSupport
        run: |
          git clone https://github.com/opa334/CCSupportTemplates.git $HOME/CCSupportTemplates
          cd $HOME/CCSupportTemplates/
          chmod +x install.sh
          ./install.sh
          echo "Should be done installing CCSupport"
      
      - name: Build package (rootless)
        run: |
          rm -f packages/*.deb
          make package FINALPACKAGE=1 SYSROOT=$THEOS/sdks/iPhoneOS16.5.sdk THEOS_PACKAGE_SCHEME=rootless

      - name: Archive rootless packages
        run: |
          mkdir -p packages-rootless
          mv packages/*.deb packages-rootless/

      - name: Build package (roothide)
        run: |
          rm -f packages/*.deb
          make package FINALPACKAGE=1 SYSROOT=$THEOS/sdks/iPhoneOS16.5.sdk THEOS_PACKAGE_SCHEME=roothide

      - name: Archive roothide packages
        run: |
          mkdir -p packages-roothide
          mv packages/*.deb packages-roothide/ 2>/dev/null || true

      - name: Upload rootless packages
        uses: actions/upload-artifact@v4
        with:
          name: "NetworkManagerReborn rootless"
          path: ${{ github.workspace }}/packages-rootless/*.deb

      - name: Upload roothide packages
        uses: actions/upload-artifact@v4
        with:
          name: "NetworkManagerReborn roothide"
          path: ${{ github.workspace }}/packages-roothide/*.deb