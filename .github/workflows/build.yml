name: Diagnose roothide on known-good toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/roothide-good-env

permissions:
  contents: read

jobs:
  build-roothide:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      FINALPACKAGE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select and report toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun clang --version
          xcrun ld -version_details

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid make

      - name: Install pinned roothide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" checkout 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$THEOS" submodule update --init --recursive

      - name: Install pinned Theos SDK
        run: |
          git clone https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks checkout 0222fd5413cf4b9af096f37b4621afa2688572f7
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Install pinned CCSupport templates
        run: |
          git clone https://github.com/opa334/CCSupportTemplates.git "$HOME/CCSupportTemplates"
          git -C "$HOME/CCSupportTemplates" checkout ec20c982b3f74f2f0500a83761363384e92a0ca3
          chmod +x "$HOME/CCSupportTemplates/install.sh"
          "$HOME/CCSupportTemplates/install.sh"

      - name: Build clean roothide package
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          make clean
          make package

      - name: Verify package and capture binary evidence
        run: |
          set -euo pipefail
          deb="$(find packages -maxdepth 1 -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$deb"
          mkdir extracted
          dpkg-deb -x "$deb" extracted

          control_center="extracted/Library/ControlCenter/Bundles/NetworkManager.bundle/NetworkManager"
          preferences="extracted/Library/PreferenceBundles/NetworkManagerPrefs.bundle/NetworkManagerPrefs"
          test -f "$control_center"
          test -f "$preferences"

          {
            echo "package=$deb"
            shasum -a 256 "$deb"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "iphoneos_sdk=$(xcrun --sdk iphoneos --show-sdk-version)"
            echo "=== Control Center binary ==="
            file "$control_center"
            xcrun vtool -show-build "$control_center"
            xcrun otool -L "$control_center"
            echo "=== Preferences binary ==="
            file "$preferences"
            xcrun vtool -show-build "$preferences"
            xcrun otool -L "$preferences"
          } | tee binary-evidence.txt

          xcrun lipo -verify_arch arm64e "$control_center"
          xcrun lipo -verify_arch arm64e "$preferences"
          xcrun otool -L "$control_center" | grep -q '@loader_path/.jbroot/usr/lib/libroothide.dylib'
          xcrun otool -L "$preferences" | grep -q '@loader_path/.jbroot/usr/lib/libroothide.dylib'
          ! xcrun otool -L "$control_center" | grep -q 'ControlCenterUIKit.framework'
          ! xcrun otool -L "$preferences" | grep -q 'Preferences.framework'

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkManagerReborn-roothide-good-env
          path: |
            packages/*_iphoneos-arm64e.deb
            binary-evidence.txt
          if-no-files-found: error
