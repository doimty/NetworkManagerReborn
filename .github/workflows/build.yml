name: Build iOS Tweak with Theos

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid make

      - name: Install Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Install Theos SDK with private frameworks
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          mv iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Install CCSupport
        run: |
          git clone https://github.com/opa334/CCSupportTemplates.git $HOME/CCSupportTemplates
          cd $HOME/CCSupportTemplates/
          chmod +x install.sh
          ./install.sh
          echo "Should be done installing CCSupport"

      - name: Build package (rootless)
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PACKAGE_SCHEME: rootless
          FINALPACKAGE: 1
        run: |
          rm -f packages/*.deb
          make package SYSROOT=$THEOS/sdks/iPhoneOS16.5.sdk

      - name: Archive rootless packages
        run: |
          mkdir -p packages-rootless
          mv packages/*.deb packages-rootless/

      - name: Build package (roothide)
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PACKAGE_SCHEME: roothide
          FINALPACKAGE: 1
        run: |
          rm -f packages/*.deb
          make package SYSROOT=$THEOS/sdks/iPhoneOS16.5.sdk

      - name: Archive roothide packages
        run: |
          mkdir -p packages-roothide
          mv packages/*.deb packages-roothide/ 2>/dev/null || true

      - name: Upload rootless packages
        uses: actions/upload-artifact@v4
        with:
          name: "NetworkManagerReborn rootless"
          path: ${{ github.workspace }}/packages-rootless/*.deb

      - name: Upload roothide packages
        uses: actions/upload-artifact@v4
        with:
          name: "NetworkManagerReborn roothide"
          path: ${{ github.workspace }}/packages-roothide/*.deb